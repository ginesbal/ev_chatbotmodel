{# templates/includes/searchbar.html — minimal rebuild #}
<form
  id="search-form"
  action="/search"
  method="get"
  role="search"
  class="search-component"
  autocomplete="off"
>
  {# always reset pagination on new query #}
  <input type="hidden" name="page" value="1" />

  <label for="search_query" class="sr-only">Search electric vehicles</label>

  <div class="search-field">
    <span class="search-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
    </span>

    <div class="search-input-wrap">
      <input
        id="search_query"
        name="search_query"
        type="search"
        placeholder="Try &ldquo;family SUV under 60k&rdquo;"
        data-placeholders='["Try &ldquo;family SUV under 60k&rdquo;","Describe what you need&hellip;","Tesla Model 3 alternative","7 seats, fast charging"]'
        class="search-input"
        aria-label="Search electric vehicles"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="search"
        data-lpignore="true"
      />
      <span class="search-placeholder-visual" aria-hidden="true">Try &ldquo;family SUV under 60k&rdquo;</span>
    </div>

    <button type="submit" class="search-submit" aria-label="Submit search">
      <span class="search-submit-label">Search</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</form>
