{# templates/includes/searchbar.html #}
<form
  id="search-form"
  action="/search"
  method="get"
  role="search"
  class="search-component"
  autocomplete="off"
  aria-busy="false"
>
  {# always reset pagination on new query #}
  <input type="hidden" name="page" value="1" />

  <div class="search-field">
    <span class="search-prefix" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
    </span>

    <label for="search_query" class="sr-only">Search electric vehicles</label>
    <div class="search-input-wrap">
      <input
        id="search_query"
        name="search_query"
        type="search"
        placeholder="Try &ldquo;family SUV under 60k&rdquo;"
        data-placeholders='["Try &ldquo;family SUV under 60k&rdquo;","Describe your range needs&hellip;","e.g. &ldquo;Tesla Model 3 alternative&rdquo;","e.g. &ldquo;7 seats, fast charging&rdquo;"]'
        class="search-input"
        aria-label="Search electric vehicles"
        aria-describedby="search-feedback"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="search"
        data-lpignore="true"
      />
      <span class="search-placeholder-visual" aria-hidden="true">Try &ldquo;family SUV under 60k&rdquo;</span>
    </div>

    <div class="search-actions">
      <button
        type="button"
        id="search-clear"
        class="search-clear"
        aria-label="Clear search"
      >
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M12 4L4 12M4 4l8 8"/>
        </svg>
      </button>

      <button
        type="submit"
        class="search-submit"
        aria-label="Search"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="search-suggestions" aria-label="Common searches">
    <span class="search-suggestions-label" aria-hidden="true">Or try</span>
    <a href="/search?search_query=SUV%20under%2050000&is_suv=true&max_price=50000&page=1" class="search-suggestion">
      <span class="search-suggestion-dot" aria-hidden="true"></span>
      Under <span class="tabular">$50k</span>
    </a>
    <a href="/search?sort=range_desc&page=1" class="search-suggestion">
      <span class="search-suggestion-dot" aria-hidden="true"></span>
      Longest range
    </a>
    <a href="/search?search_query=family%20SUV&is_suv=true&seats=7&page=1" class="search-suggestion">
      <span class="search-suggestion-dot" aria-hidden="true"></span>
      <span class="tabular">7</span>-seat family
    </a>
    <a href="/search?sort=price_asc&page=1" class="search-suggestion">
      <span class="search-suggestion-dot" aria-hidden="true"></span>
      Cheapest first
    </a>
  </div>

  <div
    id="search-feedback"
    class="search-feedback"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    hidden
  ></div>
</form>
