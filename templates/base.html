<!DOCTYPE html>
<html lang="en" class="font-sans">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}EVison Advisor{% endblock %}</title>

  <meta name="description" content="{% block meta_description %}Find your next electric vehicle. Compare EVs by range, price, seating, and charging speed.{% endblock %}">
  <meta name="theme-color" content="#0855d1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}EVison Advisor{% endblock %}">
  <meta property="og:description" content="{{ self.meta_description() }}">
  <meta property="og:image" content="/static/images/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.og_title() }}">
  <meta name="twitter:description" content="{{ self.meta_description() }}">

  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <link rel="preload" as="font" type="font/woff2" href="/static/fonts/NataSans-Regular.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/fonts/NataSans-SemiBold.woff2" crossorigin>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/lucide.css" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/core/variables.css">
  <link rel="stylesheet" href="/static/css/core/global.css">
  <link rel="stylesheet" href="/static/css/components/components.css">
  <link rel="stylesheet" href="/static/css/header.css">

  <style>
    body {
      font-family: "Nata Sans", system-ui, -apple-system, "Inter", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .skip-link,
    .skip-to-content {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .skip-link:focus,
    .skip-to-content:focus {
      position: fixed;
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
      padding: .5rem .75rem;
      background: var(--surface, #fff);
      color: var(--text, #111);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: .5rem;
      z-index: 10000;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
    }

    .nav-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.25rem;
      height: 1.25rem;
      padding: 0 .25rem;
      font-size: .75rem;
      line-height: 1;
      border-radius: 999px;
      background: var(--primary-500, #2563eb);
      color: #fff;
      margin-left: .375rem;
    }

    .site-footer {
      border-top: 1px solid var(--border, #e5e7eb);
      background: var(--section-bg, transparent);
    }

    .site-footer .footer-container {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.25rem 1rem;
      color: var(--muted, #6b7280);
      font-size: .875rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }

    .site-footer .footer-credit {
      margin: 0;
    }

    .site-footer .footer-legal {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }

    .site-footer .footer-legal a {
      color: var(--muted, #6b7280);
      text-decoration: none;
      transition: color .15s var(--ease-out-emil, ease);
    }

    .site-footer .footer-legal a:hover {
      color: var(--primary-500, #0855d1);
    }

    @media (max-width: 560px) {
      .site-footer .footer-container {
        justify-content: center;
        text-align: center;
      }
    }

    .nav-icon {
      display: inline-block;
      vertical-align: middle;
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %} antialiased">
  <a href="#main" class="skip-link">Skip to main content</a>

  <div id="vanta-bg-global" aria-hidden="true"></div>

  {% include 'includes/header.html' %}

  <main id="main">{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="footer-container">
      <p class="footer-credit">&copy; 2026 Ehrl Balquin &mdash; portfolio project</p>
      <nav class="footer-legal" aria-label="Legal">
        <a href="/privacy">Privacy</a>
        <span aria-hidden="true">&middot;</span>
        <a href="/terms">Terms</a>
      </nav>
    </div>
  </footer>

  <script src="/static/js/lazy-loader.js"></script>

  <script>
    (function () {
      const forceAnimations = localStorage.getItem('forceAnimations') === 'true';
      const urlParams = new URLSearchParams(window.location.search);
      const animParam = urlParams.get('animations');
      if (forceAnimations || animParam === 'on') {
        document.body.setAttribute('data-force-animations', 'true');
      }
    })();

    window.addEventListener('load', () => {
      setTimeout(() => {
        const container = document.getElementById('vanta-bg-global');
        if (container && typeof LazyLoader !== 'undefined') {
          container.style.display = 'block';
          LazyLoader.loadVanta();
        }
      }, 100);
    });

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName || '';
      const typing = /INPUT|TEXTAREA|SELECT/.test(tag);
      if (e.key === '/' && !typing) {
        e.preventDefault();
        const searchInput = document.getElementById('search_query');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      } else if (e.key === 'Escape') {
        const searchInput = document.getElementById('search_query');
        if (searchInput) {
          searchInput.value = '';
        }
      }
    });
  </script>

  <div id="loadingOverlay" role="dialog" aria-modal="true" aria-label="Loading">
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
    });
  </script>

  <svg style="display:none" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
    </symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path
        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z">
      </path>
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="6 9 12 15 18 9"></polyline>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </symbol>
  </svg>

  <!-- Load saved.js FIRST - it defines window.EVisonClearFavs -->
  <script src="/static/js/saved.js" defer></script>

  <!-- Then load page-specific scripts that depend on saved.js -->
  {% block extra_js %}{% endblock %}

</body>

</html>
